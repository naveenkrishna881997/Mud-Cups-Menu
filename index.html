<canvas id="fx" aria-hidden="true"></canvas>
<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('fx');
  if (reduce) { cv.style.display='none'; return; }
  var ctx = cv.getContext('2d'), W=0, H=0, S=1, dpr = Math.min(window.devicePixelRatio||1, 2);
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    S = Math.max(0.7, Math.min(Math.min(W,H)/420, 1.6));   // size scale for phones vs desktop
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize(); window.addEventListener('resize', resize);

  var DURATION = 2000;          // ms: total fireworks time
  var FADE_START = 1650;        // ms: start fading out so the menu is clear at 2s
  var FOV = 600, G = 110;
  var COLORS = [[255,196,61],[255,107,53],[120,230,110],[255,255,255],[255,90,120],[90,200,255],[200,120,255]];
  function rnd(a,b){ return a + Math.random()*(b-a); }

  var parts = [];
  // --- burst: points on a sphere (true 3D) ---
  function burst(x,y,z,n,ci,life){
    var base = COLORS[ci % COLORS.length], t0 = now;
    for (var i=0;i<n;i++){
      var u = Math.random()*2-1, th = Math.random()*Math.PI*2, s = Math.sqrt(1-u*u);
      var sp = (150 + Math.random()*170) * S;
      var col = Math.random()<.3 ? COLORS[(Math.random()*COLORS.length)|0] : base;
      parts.push({ox:x, oy:y, oz:z, vx:s*Math.cos(th)*sp, vy:u*sp, vz:s*Math.sin(th)*sp,
                  col:col, born:t0, life:life, size:(1.3+Math.random()*1.5), k:2.4, g:G, tail:.035});
    }
  }
  // --- rocket sparks: small, short-lived, drift down ---
  function spark(x,y){
    parts.push({ox:x, oy:y, oz:0, vx:rnd(-25,25)*S, vy:rnd(20,70)*S, vz:rnd(-25,25)*S,
                col: Math.random()<.5?[255,170,60]:[255,235,190], born:now, life:.32,
                size:rnd(.8,1.5), k:1.5, g:60, tail:.02});
  }

  // --- rockets: launch from bottom, rise, explode ---
  var rockets = [], launches = [0,110,240,360,500,620,740];
  for (var i=0;i<launches.length;i++){
    rockets.push({ t:launches[i],
      x: W*(0.1 + 0.8*(i+Math.random()*0.6)/launches.length),
      y0: H+10, ty: H*rnd(.14,.46), rise: rnd(520,640),
      ci: i+((Math.random()*3)|0), z: rnd(-100,100), state:0 });
  }
  // opening bursts so something sparkles right away
  var openers = [{t:0,x:.5,y:.2,n:120,ci:0},{t:80,x:.2,y:.35,n:80,ci:1},{t:140,x:.82,y:.3,n:80,ci:4}];
  var oi = 0, now = 0, start = null, camNow = 0;

  function proj(ox,oy,oz,x,y,z,cs,sn){
    var rx = x*cs - z*sn, rz = x*sn + z*cs + oz, sc = FOV/(FOV+rz);
    return {x:ox+rx*sc, y:oy+y*sc, s:sc};
  }

  function frame(ts){
    if (start===null) start = ts;
    now = ts - start;
    ctx.clearRect(0,0,W,H);
    if (now >= DURATION){ cv.style.display='none'; return; }

    var cam = now/1000*0.8, cs = Math.cos(cam), sn = Math.sin(cam);
    var fade = now > FADE_START ? 1 - (now-FADE_START)/(DURATION-FADE_START) : 1;

    while (oi < openers.length && openers[oi].t <= now){
      var o = openers[oi++]; burst(o.x*W, o.y*H, 0, o.n, o.ci, .6);
    }
    ctx.globalCompositeOperation = 'lighter';

    // rockets
    for (var r=0;r<rockets.length;r++){
      var k = rockets[r];
      if (k.state===2 || now < k.t) continue;
      var p = Math.min(1,(now-k.t)/k.rise), e = 1-Math.pow(1-p,2);   // ease-out rise
      var rx = k.x + Math.sin(p*5+r)*6*S, ry = k.y0 + (k.ty-k.y0)*e;
      var p2 = Math.max(0,p-0.06), e2 = 1-Math.pow(1-p2,2);
      var tx = k.x + Math.sin(p2*5+r)*6*S, ty2 = k.y0 + (k.ty-k.y0)*e2;
      var g = ctx.createLinearGradient(tx,ty2,rx,ry);
      g.addColorStop(0,'rgba(255,150,40,0)'); g.addColorStop(1,'rgba(255,230,170,'+(0.9*fade)+')');
      ctx.strokeStyle = g; ctx.lineWidth = 2.6*S; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(tx,ty2); ctx.lineTo(rx,ry); ctx.stroke();
      ctx.fillStyle='rgba(255,245,220,'+fade+')';
      ctx.beginPath(); ctx.arc(rx,ry,2.2*S,0,Math.PI*2); ctx.fill();
      spark(rx,ry); spark(rx,ry);
      if (p>=1){ k.state=2; burst(rx,ry,k.z,rnd(110,150)|0,k.ci,.55); }
    }

    // particles (3D projected)
    var alive = [];
    for (var i=0;i<parts.length;i++){
      var q = parts[i], age = (now - q.born)/1000;
      if (age >= q.life) continue;
      alive.push(q);
      var d = (1-Math.exp(-age*q.k))/q.k, x = q.vx*d, y = q.vy*d + q.g*age*age*S, z = q.vz*d;
      var P = proj(q.ox,q.oy,q.oz,x,y,z,cs,sn);
      var life = 1 - age/q.life, a = life*fade*Math.min(1,P.s);
      if (a <= 0.01) continue;
      var a2 = Math.max(0,age-q.tail), d2 = (1-Math.exp(-a2*q.k))/q.k;
      var T = proj(q.ox,q.oy,q.oz,q.vx*d2,q.vy*d2+q.g*a2*a2*S,q.vz*d2,cs,sn);
      var r2 = q.size*P.s*(0.6+life*0.8)*S;
      var c = q.col;
      ctx.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(a*.6)+')'; ctx.lineWidth=r2*.8;
      ctx.beginPath(); ctx.moveTo(T.x,T.y); ctx.lineTo(P.x,P.y); ctx.stroke();
      ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
      ctx.beginPath(); ctx.arc(P.x,P.y,Math.max(.5,r2),0,Math.PI*2); ctx.fill();
    }
    parts = alive;
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }

  function go(){ resize(); requestAnimationFrame(frame); }
  var img = document.getElementById('menu');
  if (img.complete) go(); else img.addEventListener('load', go);
})();
</script>
